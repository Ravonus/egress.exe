<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Chromatic preview · EGRESS.EXE</title><link rel="stylesheet" href="./preview.css"></head><body>
<div id="chromatic-preview" aria-label="Chromatic support design preview">
  <div class="preview-tools">
    <div class="preview-mark">CHROMATIC PREVIEW / SIMULATED DEVICE / NO HARDWARE ACCESS</div>
    <label>Example cartridge<select id="cp-cart" class="cursor-interaction"><option value="2">2 MiB + 32 KiB save · Tetris board</option><option value="4">4 MiB + 128 KiB save · simulator</option><option value="8">8 MiB + 128 KiB save · simulator</option><option value="unknown">Unrecognized cartridge</option></select></label>
    <label>Example installed game<select id="cp-installed" class="cursor-interaction"><option value="other">Another game</option><option value="earlier">Earlier revision</option><option value="current">Current revision</option></select></label>
  </div>
  <section class="product" data-site="egress" aria-label="Chromatic support page">
    <header class="masthead"><div><div class="brand">EGRESS.EXE</div><div class="route">/ CHROMATIC</div></div><a class="text-link" href="/">Back to game</a></header>
    <div class="intro"><h1>On a Chromatic</h1><span class="small secondary">Your device. Your local library.</span></div>
    <nav class="nav" aria-label="Chromatic support"><button type="button" class="cursor-interaction" data-view="connect">Connect</button><button type="button" class="cursor-interaction" data-view="health">Health</button><button type="button" class="cursor-interaction" data-view="cart" aria-pressed="true">Cartridge</button><button type="button" class="cursor-interaction" data-view="firmware">Firmware</button><button type="button" class="cursor-interaction" data-view="library">Library</button><button type="button" class="cursor-interaction" data-view="recovery">Recovery</button></nav>
    <div class="dialogue"><div class="face" aria-hidden="true"></div><div><div class="speaker">FIG.EXE</div><p id="cp-dialogue">A smaller vessel. The same strange work.</p></div></div>
    <div id="cp-screen" class="screen"></div>
    <div id="cp-announcement" class="small" role="status" aria-live="polite"></div>
    <footer class="footer"><span>Backups and device details stay in this browser.</span><span>Not affiliated with ModRetro.</span></footer>
  </section>
</div>

<script type="module" src="./preview.js"></script></body></html>
